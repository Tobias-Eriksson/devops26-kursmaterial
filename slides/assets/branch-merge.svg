<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1e40af"/>
    </marker>
  </defs>

  <!-- ===== Panel A: short-lived branches ===== -->
  <text x="40" y="48" font-size="24" font-weight="bold" fill="#059669">Korta branches, täta merges</text>
  <text x="1080" y="48" text-anchor="end" font-size="19" fill="#6b7280">små ändringar → små, lätta merges</text>

  <!-- main line -->
  <line x1="60" y1="160" x2="1050" y2="160" stroke="#1e40af" stroke-width="5" marker-end="url(#arrowblue)"/>
  <text x="60" y="196" font-size="19" font-weight="bold" fill="#1e40af">main</text>

  <!-- branch 1 -->
  <path d="M 140 160 C 170 160 175 105 210 105 L 300 105 C 335 105 340 160 370 160" fill="none" stroke="#059669" stroke-width="4"/>
  <circle cx="230" cy="105" r="8" fill="#059669"/>
  <circle cx="285" cy="105" r="8" fill="#059669"/>
  <!-- branch 2 -->
  <path d="M 470 160 C 500 160 505 105 540 105 L 630 105 C 665 105 670 160 700 160" fill="none" stroke="#059669" stroke-width="4"/>
  <circle cx="560" cy="105" r="8" fill="#059669"/>
  <circle cx="615" cy="105" r="8" fill="#059669"/>
  <!-- branch 3 -->
  <path d="M 790 160 C 820 160 825 105 860 105 L 920 105 C 955 105 960 160 990 160" fill="none" stroke="#059669" stroke-width="4"/>
  <circle cx="890" cy="105" r="8" fill="#059669"/>

  <!-- main commits -->
  <circle cx="100" cy="160" r="8" fill="#1e40af"/>
  <circle cx="370" cy="160" r="9" fill="#059669" stroke="#1e40af" stroke-width="3"/>
  <circle cx="430" cy="160" r="8" fill="#1e40af"/>
  <circle cx="700" cy="160" r="9" fill="#059669" stroke="#1e40af" stroke-width="3"/>
  <circle cx="750" cy="160" r="8" fill="#1e40af"/>
  <circle cx="990" cy="160" r="9" fill="#059669" stroke="#1e40af" stroke-width="3"/>

  <!-- divider -->
  <line x1="40" y1="235" x2="1080" y2="235" stroke="#e5e7eb" stroke-width="2"/>

  <!-- ===== Panel B: long-lived branch ===== -->
  <text x="40" y="283" font-size="24" font-weight="bold" fill="#dc2626">Långlivad branch, sen merge</text>
  <text x="1080" y="283" text-anchor="end" font-size="19" fill="#6b7280">två versioner av verkligheten glider isär</text>

  <!-- main line -->
  <line x1="60" y1="410" x2="1050" y2="410" stroke="#1e40af" stroke-width="5" marker-end="url(#arrowblue)"/>
  <text x="60" y="446" font-size="19" font-weight="bold" fill="#1e40af">main</text>

  <!-- long branch -->
  <path d="M 140 410 C 170 410 175 340 210 340 L 830 340 C 870 340 880 410 915 410" fill="none" stroke="#dc2626" stroke-width="4"/>
  <circle cx="250" cy="340" r="8" fill="#dc2626"/>
  <circle cx="370" cy="340" r="8" fill="#dc2626"/>
  <circle cx="490" cy="340" r="8" fill="#dc2626"/>
  <circle cx="610" cy="340" r="8" fill="#dc2626"/>
  <circle cx="730" cy="340" r="8" fill="#dc2626"/>

  <!-- main keeps moving too -->
  <circle cx="100" cy="410" r="8" fill="#1e40af"/>
  <circle cx="300" cy="410" r="8" fill="#1e40af"/>
  <circle cx="470" cy="410" r="8" fill="#1e40af"/>
  <circle cx="640" cy="410" r="8" fill="#1e40af"/>
  <circle cx="800" cy="410" r="8" fill="#1e40af"/>

  <!-- conflict burst at the late merge -->
  <polygon points="915,342 924,365 944,350 940,375 965,371 950,391 973,400 950,409 965,429 940,425 944,450 924,435 915,458 906,435 886,450 890,425 865,429 880,409 857,400 880,391 865,371 890,375 886,350 906,365"
           fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="915" y="407" text-anchor="middle" font-size="17" font-weight="bold" fill="#dc2626">konflikt!</text>
</svg>
