<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- Dev box -->
  <rect x="40" y="120" width="330" height="230" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="205" y="165" text-anchor="middle" font-size="27" font-weight="bold" fill="#1e40af">Utveckling (Dev)</text>
  <text x="70" y="215" font-size="20" fill="#1f2937">• Belönas för förändring</text>
  <text x="70" y="252" font-size="20" fill="#1f2937">• Vill släppa nya features ofta</text>
  <text x="70" y="289" font-size="20" fill="#1f2937">• ”Funkar på min maskin!”</text>

  <!-- Ops box -->
  <rect x="630" y="120" width="330" height="230" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="795" y="165" text-anchor="middle" font-size="27" font-weight="bold" fill="#991b1b">Drift (Ops)</text>
  <text x="660" y="215" font-size="20" fill="#1f2937">• Belönas för stabilitet</text>
  <text x="660" y="252" font-size="20" fill="#1f2937">• Varje ändring är en risk</text>
  <text x="660" y="289" font-size="20" fill="#1f2937">• Har jouren när det smäller</text>

  <!-- Wall -->
  <rect x="455" y="80" width="90" height="290" fill="#d97706"/>
  <g stroke="#92400e" stroke-width="2">
    <line x1="455" y1="116" x2="545" y2="116"/>
    <line x1="455" y1="152" x2="545" y2="152"/>
    <line x1="455" y1="188" x2="545" y2="188"/>
    <line x1="455" y1="224" x2="545" y2="224"/>
    <line x1="455" y1="260" x2="545" y2="260"/>
    <line x1="455" y1="296" x2="545" y2="296"/>
    <line x1="455" y1="332" x2="545" y2="332"/>
    <line x1="500" y1="80"  x2="500" y2="116"/>
    <line x1="478" y1="116" x2="478" y2="152"/>
    <line x1="522" y1="116" x2="522" y2="152"/>
    <line x1="500" y1="152" x2="500" y2="188"/>
    <line x1="478" y1="188" x2="478" y2="224"/>
    <line x1="522" y1="188" x2="522" y2="224"/>
    <line x1="500" y1="224" x2="500" y2="260"/>
    <line x1="478" y1="260" x2="478" y2="296"/>
    <line x1="522" y1="260" x2="522" y2="296"/>
    <line x1="500" y1="296" x2="500" y2="332"/>
    <line x1="478" y1="332" x2="478" y2="370"/>
    <line x1="522" y1="332" x2="522" y2="370"/>
  </g>

  <!-- Release thrown over the wall -->
  <path d="M 380 110 Q 500 15 620 110" fill="none" stroke="#1f2937" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
  <rect x="448" y="30" width="104" height="34" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="500" y="53" text-anchor="middle" font-size="17" fill="#1f2937">release-v1.0</text>
  <text x="500" y="418" text-anchor="middle" font-size="22" font-style="italic" fill="#6b7280">”the wall of confusion”</text>
</svg>
