<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowdark" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/>
    </marker>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
    <marker id="arrowamber" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- orientation cue -->
  <text x="1080" y="45" text-anchor="end" font-size="19" fill="#6b7280">historien växer åt höger →</text>

  <!-- commit hashes -->
  <text x="200" y="95" text-anchor="middle" font-size="17" fill="#6b7280" font-family="Menlo, monospace">a3f1c9</text>
  <text x="420" y="95" text-anchor="middle" font-size="17" fill="#6b7280" font-family="Menlo, monospace">7d2e04</text>
  <text x="640" y="95" text-anchor="middle" font-size="17" fill="#6b7280" font-family="Menlo, monospace">c81b55</text>
  <text x="860" y="95" text-anchor="middle" font-size="17" fill="#6b7280" font-family="Menlo, monospace">e40a17</text>

  <!-- parent arrows: each commit points BACK at its parent -->
  <line x1="398" y1="135" x2="228" y2="135" stroke="#1f2937" stroke-width="3" marker-end="url(#arrowdark)"/>
  <line x1="618" y1="135" x2="448" y2="135" stroke="#1f2937" stroke-width="3" marker-end="url(#arrowdark)"/>
  <line x1="838" y1="135" x2="668" y2="135" stroke="#1f2937" stroke-width="3" marker-end="url(#arrowdark)"/>
  <text x="530" y="118" text-anchor="middle" font-size="16" font-style="italic" fill="#6b7280">förälder</text>

  <!-- commits -->
  <circle cx="200" cy="135" r="16" fill="#1e40af"/>
  <circle cx="420" cy="135" r="16" fill="#1e40af"/>
  <circle cx="640" cy="135" r="16" fill="#1e40af"/>
  <circle cx="860" cy="135" r="16" fill="#059669"/>

  <!-- branch label: main -> commit c81b55 -->
  <line x1="640" y1="195" x2="640" y2="160" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowblue)"/>
  <rect x="565" y="195" width="150" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="640" y="228" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e40af" font-family="Menlo, monospace">main</text>

  <!-- branch label: fix-page-title -> commit e40a17 -->
  <line x1="860" y1="195" x2="860" y2="160" stroke="#059669" stroke-width="3" marker-end="url(#arrowgreen)"/>
  <rect x="755" y="195" width="210" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="860" y="228" text-anchor="middle" font-size="20" font-weight="bold" fill="#059669" font-family="Menlo, monospace">fix-page-title</text>

  <!-- HEAD -> the branch you are on -->
  <line x1="860" y1="278" x2="860" y2="250" stroke="#d97706" stroke-width="3" marker-end="url(#arrowamber)"/>
  <rect x="790" y="278" width="140" height="50" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
  <text x="860" y="311" text-anchor="middle" font-size="22" font-weight="bold" fill="#92400e" font-family="Menlo, monospace">HEAD</text>
  <text x="945" y="311" font-size="17" font-style="italic" fill="#6b7280">= där du står just nu</text>

  <!-- helper text -->
  <text x="40" y="292" font-size="18" font-style="italic" fill="#6b7280">Pilarna pekar bakåt: varje commit vet sin förälder.</text>
  <text x="40" y="318" font-size="18" font-style="italic" fill="#6b7280">En branch är en flyttbar etikett — inte en kopia av koden.</text>
</svg>
