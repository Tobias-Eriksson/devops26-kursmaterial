<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowtf" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/>
    </marker>
    <marker id="arrowtfgray" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Step 1: Config -->
  <rect x="40" y="90" width="230" height="120" rx="12" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
  <text x="155" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#374151">.tf-filer</text>
  <text x="155" y="152" text-anchor="middle" font-size="12" fill="#4b5563">deklarativt önskat</text>
  <text x="155" y="168" text-anchor="middle" font-size="12" fill="#4b5563">tillstånd, granskbart i PR</text>
  <text x="155" y="192" text-anchor="middle" font-size="11" font-style="italic" fill="#6b7280">main.tf, variables.tf …</text>

  <!-- Step 2: Plan -->
  <rect x="310" y="90" width="230" height="120" rx="12" fill="#fed7aa" stroke="#ea580c" stroke-width="2.5"/>
  <text x="425" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#7c2d12">terraform plan</text>
  <text x="425" y="152" text-anchor="middle" font-size="12" fill="#7c2d12">jämför config mot state</text>
  <text x="425" y="168" text-anchor="middle" font-size="12" fill="#7c2d12">— räknar ut diffen</text>
  <text x="425" y="192" text-anchor="middle" font-size="11" font-style="italic" fill="#9a3412">ändrar ingenting ännu</text>

  <!-- Step 3: Apply -->
  <rect x="580" y="90" width="230" height="120" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/>
  <text x="695" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#065f46">terraform apply</text>
  <text x="695" y="152" text-anchor="middle" font-size="12" fill="#065f46">skapar/ändrar riktiga</text>
  <text x="695" y="168" text-anchor="middle" font-size="12" fill="#065f46">resurser hos OpenStack</text>
  <text x="695" y="192" text-anchor="middle" font-size="11" font-style="italic" fill="#047857">VM, SG, floating IP …</text>

  <!-- Step 4: State -->
  <rect x="850" y="90" width="230" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="965" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e40af">State-fil</text>
  <text x="965" y="152" text-anchor="middle" font-size="12" fill="#1f2937">bokför vad Terraform</text>
  <text x="965" y="168" text-anchor="middle" font-size="12" fill="#1f2937">tror finns på riktigt</text>
  <text x="965" y="192" text-anchor="middle" font-size="11" font-style="italic" fill="#1e40af">committas ALDRIG till git</text>

  <!-- Flow arrows -->
  <line x1="270" y1="150" x2="305" y2="150" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrowtf)"/>
  <line x1="540" y1="150" x2="575" y2="150" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrowtf)"/>
  <line x1="810" y1="150" x2="845" y2="150" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrowtf)"/>

  <!-- Idempotence loop back -->
  <path d="M 965 215 C 965 300 425 300 425 215" fill="none" stroke="#9ca3af" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowtfgray)"/>
  <text x="695" y="330" text-anchor="middle" font-size="15" font-style="italic" fill="#6b7280">samma config igen, ingen ändring gjord av någon → "No changes." (idempotent)</text>

  <!-- Destroy annotation -->
  <rect x="40" y="365" width="1040" height="75" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="2.5"/>
  <text x="60" y="392" font-size="14" font-weight="bold" fill="#7f1d1d">terraform destroy (utan -target) när en resurs har lifecycle { prevent_destroy = true }:</text>
  <text x="60" y="414" font-size="13" fill="#7f1d1d">Terraform vägrar redan vid PLAN-steget — felet gäller floating-IP-resursen, och INGENTING rivs (varken VM, security group, keypair eller association).</text>
  <text x="60" y="432" font-size="12" font-style="italic" fill="#991b1b">Det är avsett, inte trasigt — så garanteras adressen överleva en vanlig destroy.</text>
</svg>
