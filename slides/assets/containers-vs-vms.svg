<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" font-family="Helvetica, Arial, sans-serif">

  <!-- ===== Panel A: virtuella maskiner ===== -->
  <text x="40" y="40" font-size="24" font-weight="bold" fill="#dc2626">Virtuella maskiner</text>
  <text x="40" y="64" font-size="16" fill="#6b7280">varje app släpar med ett helt operativsystem</text>

  <rect x="40" y="380" width="470" height="40" fill="#6b7280" rx="4"/>
  <text x="275" y="405" text-anchor="middle" font-size="17" fill="#ffffff">Hårdvara</text>

  <rect x="40" y="330" width="470" height="40" fill="#9ca3af" rx="4"/>
  <text x="275" y="355" text-anchor="middle" font-size="17" fill="#ffffff">Värdens OS</text>

  <rect x="40" y="280" width="470" height="40" fill="#1e40af" rx="4"/>
  <text x="275" y="305" text-anchor="middle" font-size="17" fill="#ffffff">Hypervisor</text>

  <!-- three VMs, each with its own guest OS -->
  <g>
    <rect x="55" y="120" width="135" height="150" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="4"/>
    <rect x="65" y="220" width="115" height="40" fill="#fecaca" rx="3"/>
    <text x="122" y="245" text-anchor="middle" font-size="14" fill="#7f1d1d">Gäst-OS</text>
    <rect x="65" y="170" width="115" height="35" fill="#dc2626" rx="3"/>
    <text x="122" y="193" text-anchor="middle" font-size="14" fill="#ffffff">App</text>
    <text x="122" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">VM 1</text>
  </g>
  <g>
    <rect x="205" y="120" width="135" height="150" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="4"/>
    <rect x="215" y="220" width="115" height="40" fill="#fecaca" rx="3"/>
    <text x="272" y="245" text-anchor="middle" font-size="14" fill="#7f1d1d">Gäst-OS</text>
    <rect x="215" y="170" width="115" height="35" fill="#dc2626" rx="3"/>
    <text x="272" y="193" text-anchor="middle" font-size="14" fill="#ffffff">App</text>
    <text x="272" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">VM 2</text>
  </g>
  <g>
    <rect x="355" y="120" width="135" height="150" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="4"/>
    <rect x="365" y="220" width="115" height="40" fill="#fecaca" rx="3"/>
    <text x="422" y="245" text-anchor="middle" font-size="14" fill="#7f1d1d">Gäst-OS</text>
    <rect x="365" y="170" width="115" height="35" fill="#dc2626" rx="3"/>
    <text x="422" y="193" text-anchor="middle" font-size="14" fill="#ffffff">App</text>
    <text x="422" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">VM 3</text>
  </g>

  <text x="275" y="100" text-anchor="middle" font-size="16" fill="#dc2626">GB:s stora, minuter att starta</text>

  <!-- divider -->
  <line x1="555" y1="20" x2="555" y2="460" stroke="#e5e7eb" stroke-width="2"/>

  <!-- ===== Panel B: containers ===== -->
  <text x="610" y="40" font-size="24" font-weight="bold" fill="#059669">Containers</text>
  <text x="610" y="64" font-size="16" fill="#6b7280">delar värdens kernel — bara appen är isolerad</text>

  <rect x="610" y="380" width="470" height="40" fill="#6b7280" rx="4"/>
  <text x="845" y="405" text-anchor="middle" font-size="17" fill="#ffffff">Hårdvara</text>

  <rect x="610" y="330" width="470" height="40" fill="#9ca3af" rx="4"/>
  <text x="845" y="355" text-anchor="middle" font-size="17" fill="#ffffff">Värdens OS (delad kernel)</text>

  <rect x="610" y="280" width="470" height="40" fill="#1e40af" rx="4"/>
  <text x="845" y="305" text-anchor="middle" font-size="17" fill="#ffffff">Container-motor (Docker)</text>

  <!-- three containers, just the app, thinner -->
  <g>
    <rect x="625" y="200" width="135" height="70" fill="#ecfdf5" stroke="#059669" stroke-width="2" rx="4"/>
    <rect x="635" y="220" width="115" height="35" fill="#059669" rx="3"/>
    <text x="692" y="243" text-anchor="middle" font-size="14" fill="#ffffff">App</text>
    <text x="692" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">Container 1</text>
  </g>
  <g>
    <rect x="775" y="200" width="135" height="70" fill="#ecfdf5" stroke="#059669" stroke-width="2" rx="4"/>
    <rect x="785" y="220" width="115" height="35" fill="#059669" rx="3"/>
    <text x="842" y="243" text-anchor="middle" font-size="14" fill="#ffffff">App</text>
    <text x="842" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">Container 2</text>
  </g>
  <g>
    <rect x="925" y="200" width="135" height="70" fill="#ecfdf5" stroke="#059669" stroke-width="2" rx="4"/>
    <rect x="935" y="220" width="115" height="35" fill="#059669" rx="3"/>
    <text x="992" y="243" text-anchor="middle" font-size="14" fill="#ffffff">App</text>
    <text x="992" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">Container 3</text>
  </g>

  <text x="845" y="100" text-anchor="middle" font-size="16" fill="#059669">MB:s små, sekunder att starta</text>
</svg>
