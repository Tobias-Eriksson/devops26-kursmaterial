<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowdark" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/>
    </marker>
    <marker id="arrowgray" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Step 1: branch -->
  <rect x="30" y="95" width="180" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="120" y="130" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e40af">Branch</text>
  <text x="120" y="158" text-anchor="middle" font-size="15" fill="#1f2937" font-family="Menlo, monospace">git switch -c ...</text>

  <!-- Step 2: commit + push -->
  <rect x="250" y="95" width="180" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="340" y="130" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e40af">Commit + push</text>
  <text x="340" y="158" text-anchor="middle" font-size="15" fill="#1f2937">små, med tydligt varför</text>

  <!-- Step 3: pull request -->
  <rect x="470" y="95" width="180" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="560" y="130" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e40af">Pull request</text>
  <text x="560" y="158" text-anchor="middle" font-size="15" fill="#1f2937">öppnas på GitHub</text>

  <!-- Gate: branch protection -->
  <rect x="690" y="70" width="230" height="130" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
  <text x="805" y="103" text-anchor="middle" font-size="21" font-weight="bold" fill="#92400e">Branch protection</text>
  <text x="712" y="138" font-size="16" fill="#1f2937">✓ 1 godkänd review</text>
  <text x="712" y="168" font-size="16" fill="#1f2937">✓ Lint and test backend</text>
  <text x="805" y="192" text-anchor="middle" font-size="13" font-style="italic" fill="#6b7280">(checken blir obligatorisk i M5)</text>

  <!-- Step 5: merge -->
  <rect x="950" y="95" width="150" height="80" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="1025" y="130" text-anchor="middle" font-size="22" font-weight="bold" fill="#059669">Merge</text>
  <text x="1025" y="158" text-anchor="middle" font-size="15" fill="#1f2937">till main</text>

  <!-- Flow arrows -->
  <line x1="210" y1="135" x2="243" y2="135" stroke="#1f2937" stroke-width="3" marker-end="url(#arrowdark)"/>
  <line x1="430" y1="135" x2="463" y2="135" stroke="#1f2937" stroke-width="3" marker-end="url(#arrowdark)"/>
  <line x1="650" y1="135" x2="683" y2="135" stroke="#1f2937" stroke-width="3" marker-end="url(#arrowdark)"/>
  <line x1="920" y1="135" x2="943" y2="135" stroke="#1f2937" stroke-width="3" marker-end="url(#arrowdark)"/>

  <!-- Review feedback loop back to commit -->
  <path d="M 805 200 C 805 275 420 275 345 183" fill="none" stroke="#9ca3af" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrowgray)"/>
  <text x="575" y="296" text-anchor="middle" font-size="17" font-style="italic" fill="#6b7280">review-kommentarer → fixa → nya commits hamnar i samma PR</text>

  <!-- Branch deleted after merge -->
  <text x="1025" y="222" text-anchor="middle" font-size="15" font-style="italic" fill="#6b7280">…sedan raderas</text>
  <text x="1025" y="242" text-anchor="middle" font-size="15" font-style="italic" fill="#6b7280">branchen</text>

  <!-- Title row: nothing enters main any other way -->
  <text x="560" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Från och med M2: ingen annan väg in i main</text>
</svg>
