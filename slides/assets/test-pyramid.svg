<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" font-family="Helvetica, Arial, sans-serif">

  <!-- ===== Bottom band: enhetstester (unit) ===== -->
  <polygon points="140,460 980,460 840,320 280,320" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="560" y="378" text-anchor="middle" font-size="22" font-weight="bold" fill="#065f46">Enhetstester (unit)</text>
  <text x="560" y="406" text-anchor="middle" font-size="15" fill="#065f46">en funktion i taget, inga andra system inblandade</text>
  <text x="560" y="428" text-anchor="middle" font-size="15" fill="#065f46">snabbast att köra, flest till antalet</text>

  <!-- ===== Middle band: integrationstester ===== -->
  <polygon points="280,320 840,320 700,180 420,180" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="560" y="242" text-anchor="middle" font-size="21" font-weight="bold" fill="#7c2d12">Integrationstester</text>
  <text x="560" y="268" text-anchor="middle" font-size="15" fill="#7c2d12">TestClient mot hela API:et — flera delar i samspel</text>

  <!-- ===== Top band: manuellt / E2E ===== -->
  <polygon points="420,180 700,180 560,40" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="560" y="140" text-anchor="middle" font-size="17" font-weight="bold" fill="#7f1d1d">Manuellt / E2E</text>
  <text x="560" y="162" text-anchor="middle" font-size="13" fill="#7f1d1d">klicka i webbläsaren</text>

  <!-- ===== Side axis ===== -->
  <defs>
    <marker id="arrowaxis" markerWidth="10" markerHeight="10" refX="5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="1010" y1="450" x2="1010" y2="50" stroke="#374151" stroke-width="2" marker-end="url(#arrowaxis)"/>
  <text x="1030" y="80" font-size="14" fill="#374151">färre</text>
  <text x="1030" y="98" font-size="14" fill="#374151">långsammare</text>
  <text x="1030" y="116" font-size="14" fill="#374151">dyrare</text>
  <text x="1030" y="404" font-size="14" fill="#374151">fler</text>
  <text x="1030" y="422" font-size="14" fill="#374151">snabbare</text>
  <text x="1030" y="440" font-size="14" fill="#374151">billigare</text>

  <text x="40" y="40" font-size="18" fill="#6b7280">samma app, tre sätt att kontrollera den — inte antingen-eller</text>
</svg>
